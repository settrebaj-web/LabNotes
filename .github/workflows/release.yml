# Тапсырма 11 — v* тегі: қол қойылған AAB+APK → GitHub pre-release (internal) → қолмен растау → Latest (production)
#
# Қажетті GitHub Secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   GOOGLE_SERVICES_JSON — (міндетті емес) app/google-services.json мазмұны
# Қолмен растау: Settings → Environments → "production" → Required reviewers.
# Google Play варианты (Gradle Play Publisher) — docs/10-11-ci-cd.md, «Google Play үшін» бөлімі.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  internal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches version.properties
        run: |
          V=$(awk -F= '/^VERSION_MAJOR/{a=$2}/^VERSION_MINOR/{b=$2}/^VERSION_PATCH/{c=$2}END{print a"."b"."c}' version.properties | tr -d '\r')
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME мен version.properties ($V) сәйкес емес"
            exit 1
          fi

      - name: Restore secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          if [ -n "$GS_JSON" ]; then echo "$GS_JSON" > app/google-services.json; fi

      - name: Build signed AAB + APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease assembleRelease archiveReleaseMapping
          cp app/build/outputs/apk/release/app-release.apk "LabNotes-${GITHUB_REF_NAME}.apk"

      - name: Store artifacts (AAB, APK, mapping.txt)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/*.aab
            LabNotes-*.apk
            release-artifacts/
          retention-days: 90

      - name: Publish to internal channel (GitHub pre-release)
        uses: softprops/action-gh-release@v2
        with:
          name: LabNotes ${{ github.ref_name }}
          prerelease: true
          files: LabNotes-${{ github.ref_name }}.apk
          body_path: app/src/main/play/release-notes/ru-RU/default.txt

  production:
    needs: internal
    runs-on: ubuntu-latest
    environment: production # ← осы жерде Required reviewers растауын күтеді
    steps:
      - name: Promote internal → production (Latest release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
