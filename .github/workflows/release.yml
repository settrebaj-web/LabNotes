# Тапсырма 11 — v* тегі: қол қойылған AAB → Google Play internal → (қолмен растау) → production 1%
#
# Қажетті GitHub Secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64      — upload keystore, base64 түрінде
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON — Google Play Android Developer API сервис-аккаунтының JSON кілті
#   GOOGLE_SERVICES_JSON — (міндетті емес) app/google-services.json мазмұны
# Қолмен растау: Settings → Environments → "production" → Required reviewers.
# Айнымалы (Variables) PROMOTE_TRACK: production (әдепкі) немесе alpha (жеке аккаунттағы жабық тест).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  internal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches version.properties
        run: |
          V=$(awk -F= '/^VERSION_MAJOR/{a=$2}/^VERSION_MINOR/{b=$2}/^VERSION_PATCH/{c=$2}END{print a"."b"."c}' version.properties)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME мен version.properties ($V) сәйкес емес"
            exit 1
          fi

      - name: Restore secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
          echo "PLAY_CREDENTIALS_PATH=$RUNNER_TEMP/play.json" >> "$GITHUB_ENV"
          if [ -n "$GS_JSON" ]; then echo "$GS_JSON" > app/google-services.json; fi

      - name: Build signed AAB + APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease archiveReleaseMapping

      - name: Upload to Google Play (internal)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew publishReleaseBundle --track internal

      - name: Store artifacts (AAB, APK, mapping.txt)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            release-artifacts/
          retention-days: 90

      - name: GitHub Release (APK тікелей орнату үшін)
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body_path: app/src/main/play/release-notes/ru-RU/default.txt

  production:
    needs: internal
    runs-on: ubuntu-latest
    environment: production # ← осы жерде Required reviewers растауын күтеді
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore Play credentials
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
          echo "PLAY_CREDENTIALS_PATH=$RUNNER_TEMP/play.json" >> "$GITHUB_ENV"

      - name: Promote internal → production (staged 1%)
        run: >
          ./gradlew promoteReleaseArtifact
          --from-track internal
          --promote-track ${{ vars.PROMOTE_TRACK || 'production' }}
          --release-status inProgress
          --user-fraction 0.01
